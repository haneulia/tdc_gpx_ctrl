part=xc7z020clg484-2

[hls]
flow_target=vivado
# The generated RTL runs at 150 or 200 MHz. A 4 ns HLS scheduling target
# reserves routing margin for the wide Frame Cell state on 7-series devices.
clock=4ns
clock_uncertainty=12.5%
package.output.format=rtl
syn.file=./src/gpx_frame_assembler_hls.cpp
syn.top=gpx_frame_assembler_hls
syn.cflags=-I./src -I../common/include
syn.csimflags=-Wno-unknown-pragmas
tb.file=./tb/tb_gpx_frame_assembler_hls.cpp
tb.cflags=-I./src -I../common/include -Wno-unknown-pragmas
csim.clean=true
cosim.trace_level=port
