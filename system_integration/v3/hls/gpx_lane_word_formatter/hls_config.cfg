part=xc7z020clg484-2

[hls]
flow_target=vivado
# H4 is used at 150 or 200 MHz. Synthesis targets the faster supported mode;
# routed 150/200 MHz implementation remains the final timing sign-off.
clock=5ns
clock_uncertainty=10%
package.output.format=rtl
syn.file=./src/gpx_lane_word_formatter_hls.cpp
syn.top=gpx_lane_word_formatter_hls
syn.cflags=-I./src -I../common/include
syn.csimflags=-Wno-unknown-pragmas
tb.file=./tb/tb_gpx_lane_word_formatter_hls.cpp
tb.cflags=-I./src -I../common/include -Wno-unknown-pragmas
csim.clean=true
cosim.trace_level=port
